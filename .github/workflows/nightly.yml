name: "nightly"

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    with:
      # voxpupuli-puppet-lint-plugins 7.0 (needed for Puppet 9 support) requires
      # ruby >= 3.2; the default (3.1) can no longer resolve the :development group.
      ruby_version: "3.2"
      # puppet_litmus -> bolt 4.x -> faraday-patron -> patron builds a libcurl native extension;
      # the runner has no libcurl headers, so install them before bundle (Puppet 9 lane, Ruby 4).
      additional_packages: "libcurl4-openssl-dev"
    secrets: "inherit"

  Acceptance:
    needs: Spec
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    with:
      # A -nightly collection installs puppet-agent-x64-latest.msi without a version.
      # Don't add --latest-agent: it pins the latest release's MSI name, which the
      # nightly repo doesn't keep (404, MODULES-12071).
      flags: "--nightly"
      ruby_version: "3.2"
    secrets: "inherit"
